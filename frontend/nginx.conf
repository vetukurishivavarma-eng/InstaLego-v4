server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 200m;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_read_timeout 600s;   # OCR + Map + Reduce on a large bundle can take minutes
    proxy_send_timeout 600s;
  }

  location / {
    try_files $uri /index.html;
  }
}
